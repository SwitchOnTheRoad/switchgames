<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 — Switch</title><link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#080808;--blue:#2563EB;--white:#FAFAF8;--muted:#6B6B6B;--rule:#1C1C1C;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--ink);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.big-num{font-family:'Anton',sans-serif;font-size:clamp(8rem,25vw,16rem);line-height:0.85;letter-spacing:-0.02em;color:rgba(37,99,235,0.12);user-select:none;margin-bottom:-1rem;}
h1{font-family:'Anton',sans-serif;font-size:clamp(2rem,5vw,4rem);text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:1rem;}
p{color:var(--muted);font-size:0.975rem;max-width:360px;line-height:1.75;margin-bottom:2.5rem;}
.links{display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 1.75rem;font-family:'Manrope',sans-serif;font-weight:700;font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;transition:background 0.15s,transform 0.12s;}
.btn:hover{transform:translateY(-1px);}
.btn-blue{background:var(--blue);color:var(--white);}
.btn-blue:hover{background:#1D4ED8;}
.btn-dark{background:#111;color:var(--white);border:1px solid var(--rule);}
.btn-dark:hover{background:#181818;}
</style></head>
<body>
<div class="big-num">404</div>
<h1>Page Not Found.</h1>
<p>The page you're looking for doesn't exist or has been moved.</p>
<div class="links"><a href="/" class="btn btn-blue">← Back to Home</a><a href="/games" class="btn btn-dark">Explore Games</a></div>
</body></html>
