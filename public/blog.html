<!DOCTYPE html>
<html lang="en">
<head><script src="/loader.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog — Switch</title><link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#040b18;--bg2:#071424;--bg3:#0d1f3c;--blue:#3b82f6;--blue-mid:#2563eb;--white:#e4edff;--muted:#4a6890;--rule:#112035;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--white);overflow-x:hidden;}
h1,h2,h3{font-family:'Russo One',sans-serif;text-transform:uppercase;line-height:0.95;letter-spacing:-0.01em;}a{text-decoration:none;color:inherit;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 1.75rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;border:none;text-decoration:none;transition:background 0.15s,transform 0.12s,box-shadow 0.15s;border-radius:4px;}
.btn:hover{transform:translateY(-1px);}
#grid-view{display:block;}
.page-hdr{padding:140px 3rem 5rem;border-bottom:1px solid var(--rule);}
.ph-inner{max-width:1400px;margin:0 auto;}
.ph-eye{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;}
.ph-eye::before{content:'';display:block;width:20px;height:1px;background:var(--blue);}
.ph-h1{font-size:clamp(4rem,9vw,8rem);line-height:0.9;}
.ph-sub{color:var(--muted);font-size:0.975rem;line-height:1.8;margin-top:1.5rem;}
.section{max-width:1400px;margin:0 auto;padding:5rem 3rem 7rem;}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);}
.blog-card{background:var(--ink);cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background 0.15s;}
.blog-card:hover{background:#0d0d0d;}
.blog-card.lead{grid-column:1/-1;}
.blog-img-wrap{overflow:hidden;}
.blog-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform 0.6s cubic-bezier(0.16,1,0.3,1),filter 0.3s;filter:grayscale(20%);}
.blog-card.lead .blog-img{aspect-ratio:21/9;}
.blog-card:hover .blog-img{transform:scale(1.04);filter:grayscale(0%);}
.blog-img-ph{width:100%;aspect-ratio:16/9;background:#0e0e0e;}
.blog-body{padding:1.75rem;flex:1;display:flex;flex-direction:column;border-top:1px solid var(--rule);}
.blog-card.lead .blog-body{padding:2rem 2.25rem;}
.blog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.875rem;}
.blog-date{font-family:'JetBrains Mono',monospace;font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--blue);}
.blog-rt{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--muted);}
.blog-title{font-family:'Russo One',sans-serif;font-size:1.2rem;text-transform:uppercase;letter-spacing:-0.01em;line-height:1;margin-bottom:0.75rem;}
.blog-card.lead .blog-title{font-size:1.75rem;}
.blog-preview{color:var(--muted);font-size:0.875rem;line-height:1.7;}
.blog-author{display:flex;align-items:center;gap:0.5rem;margin-top:auto;padding-top:1rem;}
.blog-av{width:22px;height:22px;background:#111;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:0.6rem;color:var(--blue);overflow:hidden;flex-shrink:0;}
.blog-av img{width:100%;height:100%;object-fit:cover;display:block;}
.blog-an{font-size:0.72rem;color:var(--muted);font-weight:500;}
.blog-empty{padding:5rem 2rem;text-align:center;color:#222;font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.14em;text-transform:uppercase;}

/* READER */
#reader-view{display:none;position:fixed;inset:0;background:var(--ink);z-index:9999;overflow-y:auto;}
#reader-view.open{display:block;}
.reader-bar{position:sticky;top:0;background:rgba(8,8,8,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--rule);padding:0 3rem;height:60px;display:flex;align-items:center;gap:1rem;z-index:10;}
.reader-back{display:inline-flex;align-items:center;gap:0.5rem;background:transparent;border:1px solid var(--rule);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.5rem 1rem;cursor:pointer;transition:all 0.2s;}
.reader-back:hover{color:var(--white);border-color:#333;}
.reader-bar-title{flex:1;font-family:'Russo One',sans-serif;font-size:0.9rem;text-transform:uppercase;letter-spacing:-0.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reader-copy{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;background:transparent;border:1px solid var(--rule);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
.reader-copy:hover{color:var(--white);border-color:#333;}
.reader-copy.copied{color:var(--blue);border-color:rgba(37,99,235,0.4);}
.reader-cover{width:100%;max-height:420px;object-fit:cover;display:block;border-bottom:1px solid var(--rule);}
.reader-content{max-width:720px;margin:0 auto;padding:5rem 3rem 8rem;}
.reader-meta{display:flex;gap:1.5rem;align-items:center;margin-bottom:1.5rem;font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;}
.r-date{color:var(--blue);}
.r-sep{width:1px;height:10px;background:var(--rule);}
.r-rt{color:var(--muted);}
.reader-title{font-family:'Russo One',sans-serif;font-size:clamp(2.25rem,5vw,3.75rem);text-transform:uppercase;letter-spacing:-0.01em;line-height:0.93;margin-bottom:0.75rem;}
.reader-author{display:flex;align-items:center;gap:1rem;margin-bottom:3rem;padding:1.25rem 1.5rem;border-left:2px solid var(--blue);background:#0a0a0a;}
.r-av{width:44px;height:44px;background:#111;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:1.1rem;color:var(--blue);overflow:hidden;flex-shrink:0;}
.r-av img{width:100%;height:100%;object-fit:cover;display:block;}
.r-au-label{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}
.r-au-name{font-family:'Russo One',sans-serif;font-size:1rem;text-transform:uppercase;letter-spacing:-0.01em;color:var(--white);}
.r-au-pos{font-size:0.78rem;color:var(--muted);}
.reader-body{color:rgba(250,250,248,0.6);font-size:1rem;line-height:1.85;}
.reader-body h1,.reader-body h2,.reader-body h3{font-family:'Russo One',sans-serif;text-transform:uppercase;color:var(--white);margin:2rem 0 0.875rem;letter-spacing:-0.01em;}
.reader-body h2{font-size:1.75rem;}.reader-body h3{font-size:1.35rem;}
.reader-body p{margin-bottom:1.25rem;}.reader-body ul,.reader-body ol{margin:0 0 1.25rem 1.5rem;}.reader-body li{margin-bottom:0.5rem;}
.reader-body blockquote{border-left:2px solid var(--blue);margin:2rem 0;padding:1rem 1.5rem;color:var(--muted);font-style:italic;background:#0a0a0a;}
.reader-body img{max-width:100%;margin:2rem auto;display:block;}
.reader-body a{color:var(--blue);}.reader-body a:hover{text-decoration:underline;}
.reader-body strong{color:var(--white);font-weight:600;}
#sw-toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(12px);background:#111;border:1px solid var(--rule);color:var(--white);font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.08em;padding:0.6rem 1.25rem;opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;z-index:99999;white-space:nowrap;}
#sw-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.tags-row{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.tag-pill{font-family:'JetBrains Mono',monospace;font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--rule);}
.tag-pill.game{color:var(--blue);border-color:rgba(37,99,235,0.3);}
.tag-pill.type{color:var(--muted);}
@media(max-width:900px){.blog-grid{grid-template-columns:1fr 1fr;}.blog-card.lead{grid-column:1/-1;}}
@media(max-width:600px){.page-hdr{padding:120px 1.5rem 3.5rem;}.section{padding:3.5rem 1.5rem 5rem;}.blog-grid{grid-template-columns:1fr;}.blog-card.lead{grid-column:1;}.reader-bar{padding:0 1.5rem;}.reader-bar-title{display:none;}.reader-content{padding:2.5rem 1.5rem 6rem;}}
</style></head>
<body>
<div id="grid-view">
    <div class="page-hdr"><div class="ph-inner"><div class="ph-eye">Read</div><h1 class="ph-h1">The Blog.</h1><p class="ph-sub">Updates, dev insights and announcements from the team.</p></div></div>
    <main class="section"><div class="blog-grid" id="blog-grid"><div class="blog-empty">Loading…</div></div></main>
</div>
<div id="reader-view">
    <div class="reader-bar">
        <button class="reader-back" id="reader-back">← Back</button>
        <span class="reader-bar-title" id="reader-bar-title"></span>
        <button class="reader-copy" id="reader-copy">Copy Link</button>
    </div>
    <img id="reader-cover" class="reader-cover" src="" alt="" style="display:none;">
    <div class="reader-content">
        <div class="reader-meta"><span class="r-date" id="r-date"></span><div class="r-sep"></div><span class="r-rt" id="r-rt"></span></div>
        <h1 class="reader-title" id="r-title"></h1>
        <div class="reader-author" id="r-author" style="display:none;">
            <div class="r-av" id="r-av"></div>
            <div><div class="r-au-label">Written by</div><div class="r-au-name" id="r-au-name"></div><div class="r-au-pos" id="r-au-pos"></div></div>
        </div>
        <div class="reader-body" id="r-body"></div>
    </div>
</div>
<div id="sw-toast"></div>
<script src="/navbar.js"></script><script src="/footer.js"></script>
<script>
let allPosts=[],allGames=[],currentId=null;
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function rt(h){return Math.max(1,Math.round(strip(h).split(/\s+/).filter(Boolean).length/200))+' min read';}
function prev(h,l=150){const t=strip(h);return t.length>l?t.slice(0,l).trimEnd()+'…':t;}
function extractImg(html){const m=html.match(/<img[^>]+src=["']([^"']+)["']/i);return m?m[1]:null;}
function fmtTag(t){return t?t.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'';}
let toastT;
function toast(msg){const t=document.getElementById('sw-toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function copyLink(){
    if(!currentId)return;
    const url=`${location.origin}/blog?post=${currentId}`;
    const btn=document.getElementById('reader-copy');
    const ok=()=>{toast('Link copied!');btn.classList.add('copied');btn.textContent='Copied!';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='Copy Link';},2200);};
    const fb=()=>{try{const ta=document.createElement('textarea');ta.value=url;ta.style='position:fixed;opacity:0;';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok();}catch{toast('Copy: '+url);}};
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(ok).catch(fb);else fb();
}
function openReader(post){
    currentId=post.id;
    document.getElementById('reader-bar-title').textContent=post.title;
    document.getElementById('r-date').textContent=fmtDate(post.createdAt);
    document.getElementById('r-rt').textContent=rt(post.content);
    document.getElementById('r-title').textContent=post.title;
    document.getElementById('r-body').innerHTML=post.content;
    document.getElementById('reader-view').scrollTop=0;
    const cov=document.getElementById('reader-cover');
    if(post.image){cov.src=post.image;cov.style.display='block';}else{cov.style.display='none';}
    const title=document.getElementById('r-title');
    let existTags=document.getElementById('r-tags');if(existTags)existTags.remove();
    const taggedGame=post.taggedGameId?allGames.find(g=>g.id===post.taggedGameId):null;
    const gameLabel=taggedGame?(taggedGame.name||`Place ${taggedGame.placeId}`):'';
    const typeLabel=post.postTag?fmtTag(post.postTag):'';
    if(gameLabel||typeLabel){const div=document.createElement('div');div.id='r-tags';div.className='tags-row';div.innerHTML=`${gameLabel?`<span class="tag-pill game">${gameLabel}</span>`:''}${typeLabel?`<span class="tag-pill type">${typeLabel}</span>`:''}`;title.parentNode.insertBefore(div,title);}
    const au=document.getElementById('r-author');
    const name=post.authorName||post.author||'';
    if(name){document.getElementById('r-au-name').textContent=name;const pos=document.getElementById('r-au-pos');pos.textContent=post.authorPosition||'';pos.style.display=post.authorPosition?'':'none';const av=document.getElementById('r-av');av.innerHTML=post.authorAvatar?`<img src="${post.authorAvatar}" alt="${name}">`:'';if(!post.authorAvatar)av.textContent=name.charAt(0).toUpperCase();au.style.display='flex';}else{au.style.display='none';}
    document.getElementById('grid-view').style.display='none';
    document.getElementById('reader-view').classList.add('open');
    document.body.style.overflow='hidden';
    history.pushState({postId:post.id},'',`?post=${post.id}`);
}
function closeReader(){currentId=null;document.getElementById('grid-view').style.display='block';document.getElementById('reader-view').classList.remove('open');document.body.style.overflow='';history.pushState(null,'','/blog');}
document.getElementById('reader-back').addEventListener('click',closeReader);
document.getElementById('reader-copy').addEventListener('click',copyLink);
window.addEventListener('popstate',e=>{if(e.state?.postId){const p=allPosts.find(x=>x.id===e.state.postId);if(p){openReader(p);return;}}closeReader();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader();});
async function loadPosts(){
    const grid=document.getElementById('blog-grid');
    try{
        const[pr,gr]=await Promise.all([fetch('/api/blog/posts').then(r=>r.json()),fetch('/api/games').then(r=>r.json()).catch(()=>({games:[]}))]);
        allPosts=pr.posts||[];allGames=gr.games||[];
        if(!allPosts.length){grid.innerHTML='<div class="blog-empty">No posts yet — check back soon.</div>';return;}
        grid.innerHTML=allPosts.map((p,i)=>{
            const thumb=p.image||extractImg(p.content);
            const isLead=i===0&&allPosts.length>1;
            const aName=p.authorName||p.author||'';
            const tGame=p.taggedGameId?allGames.find(g=>g.id===p.taggedGameId):null;
            const gLbl=tGame?(tGame.name||`Place ${tGame.placeId}`):'';
            const tLbl=p.postTag?fmtTag(p.postTag):'';
            const tagsH=(gLbl||tLbl)?`<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.6rem;">${gLbl?`<span class="tag-pill game">${gLbl}</span>`:''}${tLbl?`<span class="tag-pill type">${tLbl}</span>`:''}</div>`:'';
            return`<div class="blog-card${isLead?' lead':''}" data-id="${p.id}">
                <div class="blog-img-wrap">${thumb?`<img src="${thumb}" class="blog-img" alt="${p.title}" loading="lazy">`:'<div class="blog-img-ph"></div>'}</div>
                <div class="blog-body">
                    <div class="blog-top"><span class="blog-date">${fmtDate(p.createdAt)}</span><span class="blog-rt">${rt(p.content)}</span></div>
                    ${tagsH}<h3 class="blog-title">${p.title}</h3>
                    <p class="blog-preview">${prev(p.content)}</p>
                    ${aName?`<div class="blog-author"><div class="blog-av">${p.authorAvatar?`<img src="${p.authorAvatar}" alt="${aName}">`:aName.charAt(0).toUpperCase()}</div><span class="blog-an">${aName}</span></div>`:''}
                </div></div>`;
        }).join('');
        document.querySelectorAll('.blog-card').forEach(card=>{card.addEventListener('click',()=>{const p=allPosts.find(x=>x.id===card.dataset.id);if(p)openReader(p);});});
        const pid=new URLSearchParams(location.search).get('post');
        if(pid){const p=allPosts.find(x=>x.id===pid);if(p)openReader(p);}
    }catch(e){grid.innerHTML='<div class="blog-empty">Failed to load posts.</div>';}
}
loadPosts();
</script>
</body></html>
