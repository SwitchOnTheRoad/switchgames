<!DOCTYPE html>
<html lang="en">
<head><script src="/loader.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Games — Switch</title><link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#040b18;--bg2:#071424;--bg3:#0d1f3c;--blue:#3b82f6;--blue-mid:#2563eb;--white:#e4edff;--muted:#4a6890;--rule:#112035;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--white);overflow-x:hidden;}
h1,h2,h3{font-family:'Russo One',sans-serif;text-transform:uppercase;line-height:0.95;letter-spacing:-0.01em;}a{text-decoration:none;color:inherit;}
[data-r]{opacity:0;transform:translateY(28px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1);}[data-r].in{opacity:1;transform:none;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 1.75rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;border:none;text-decoration:none;transition:background 0.15s,transform 0.12s,box-shadow 0.15s;border-radius:4px;}
.btn:hover{transform:translateY(-1px);}.btn-blue{background:var(--blue);color:var(--white);}.btn-blue:hover{background:var(--blue-mid);box-shadow:0 0 18px rgba(59,130,246,0.35);}
.page-hdr{padding:140px 3rem 5rem;border-bottom:1px solid var(--rule);}
.ph-inner{max-width:1400px;margin:0 auto;}
.ph-eye{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;}
.ph-eye::before{content:'';display:block;width:20px;height:1px;background:var(--blue);}
.ph-h1{font-size:clamp(4rem,9vw,8rem);line-height:0.9;letter-spacing:-0.01em;}
.ph-sub{color:var(--muted);font-size:0.975rem;line-height:1.8;max-width:440px;margin-top:1.5rem;}
.section{max-width:1400px;margin:0 auto;padding:5rem 3rem 7rem;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1px;background:var(--rule);}
.game-card{background:var(--ink);display:block;text-decoration:none;color:var(--white);position:relative;overflow:hidden;transition:background 0.15s;}
.game-card:hover{background:#071424;}
.game-img-wrap{overflow:hidden;}
.game-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform 0.6s cubic-bezier(0.16,1,0.3,1),filter 0.3s;filter:brightness(0.85);}
.game-card:hover .game-img{transform:scale(1.05);filter:brightness(1);}
.game-img-ph{width:100%;aspect-ratio:16/9;background:#0d1f3c;display:flex;align-items:center;justify-content:center;}
.game-img-ph svg{opacity:0.12;}
.game-info{padding:1.75rem;border-top:1px solid var(--rule);}
.game-featured{display:inline-flex;align-items:center;gap:0.4rem;font-family:'JetBrains Mono',monospace;font-size:0.5rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--blue);margin-bottom:0.6rem;}
.game-featured::before{content:'';width:5px;height:5px;background:var(--blue);border-radius:50%;}
.game-name{font-family:'Russo One',sans-serif;font-size:1.3rem;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:1.25rem;line-height:1;}
.game-stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.g-stat-lbl{font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.3rem;}
.g-stat-val{font-family:'Russo One',sans-serif;font-size:1.6rem;line-height:1;letter-spacing:-0.01em;}
.empty{grid-column:1/-1;background:#071424;padding:6rem 2rem;text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:#1a3050;}
@media(max-width:768px){.page-hdr{padding:120px 1.5rem 3.5rem;}.section{padding:3.5rem 1.5rem 5rem;}.games-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.page-hdr{padding:100px 1.25rem 2.5rem;}.section{padding:2.5rem 1.25rem;}.games-grid{grid-template-columns:1fr;}.ph-h1{font-size:clamp(2.5rem,10vw,5rem);}}
</style>
</head>
<body>
<div class="page-hdr"><div class="ph-inner"><h1 class="ph-h1">Our Games.</h1><p class="ph-sub">Worlds we've built on Roblox — crafted for millions of players.</p></div></div>
<main class="section"><div class="games-grid" id="games-grid"><div class="empty">Loading games…</div></div></main>
<script src="/navbar.js"></script><script src="/footer.js"></script>
<script>
function fmt(n){if(!n)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString();}
async function loadGames(){
    const grid=document.getElementById('games-grid');
    try{
        const{games}=await fetch('/api/games').then(r=>r.json());
        if(!games.length){grid.innerHTML='<div class="empty">No games published yet.</div>';return;}
        grid.innerHTML=games.map(g=>`<a href="https://www.roblox.com/games/${g.placeId}" target="_blank" class="game-card">
            <div class="game-img-wrap">${g.thumbnail?`<img src="${g.thumbnail}" class="game-img" alt="${g.name||''}" loading="lazy">`:'<div class="game-img-ph"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="0.75"><rect x="2" y="3" width="20" height="14" rx="1"/><path d="M8 21h8M12 17v4"/></svg></div>'}</div>
            <div class="game-info">
                ${g.featured?'<div class="game-featured">Featured</div>':''}
                <div class="game-name">${g.name||'Untitled Game'}</div>
                <div class="game-stats"><div><div class="g-stat-lbl">Visits</div><div class="g-stat-val">${fmt(g.visits)}</div></div><div><div class="g-stat-lbl">Playing</div><div class="g-stat-val">${fmt(g.playing)}</div></div></div>
            </div></a>`).join('');
    }catch(e){grid.innerHTML='<div class="empty">Failed to load games.</div>';}
}
loadGames();
const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');obs.unobserve(x.target);}});},{threshold:0.07});
document.querySelectorAll('[data-r]').forEach(el=>obs.observe(el));
</script>
</body></html>
