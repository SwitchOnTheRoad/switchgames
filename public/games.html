<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games — Switch</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FBBF24;
            --bg: #0A0A0A;
            --surface: #111111;
            --surface-mid: #181818;
            --border: #242424;
            --text: #F5F5F5;
            --muted: #808080;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Syne', sans-serif; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9998; opacity: 0.35;
        }

        /* PAGE HEADER */
        .page-header {
            padding: 130px 4vw 5rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .page-header-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(251,191,36,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(251,191,36,0.03) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(ellipse 80% 100% at 0% 50%, black 0%, transparent 70%);
        }
        .page-header-inner { max-width: 1300px; margin: 0 auto; position: relative; }

        .section-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.22em;
            color: var(--primary);
            text-transform: uppercase;
            display: flex; align-items: center; gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .section-label::before {
            content: ''; display: block;
            width: 32px; height: 1px;
            background: var(--primary); opacity: 0.5;
        }

        .page-header h1 { font-size: clamp(3rem, 6vw, 5.5rem); margin-bottom: 1rem; }
        .page-header p { color: var(--muted); font-size: 1rem; max-width: 440px; line-height: 1.75; }

        /* GAMES GRID */
        .section { max-width: 1300px; margin: 0 auto; padding: 5rem 4vw 7rem; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .game-card {
            background: var(--surface);
            text-decoration: none; color: var(--text);
            display: block;
            transition: background 0.18s;
            position: relative;
            overflow: hidden;
        }
        .game-card::after {
            content: '';
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.4s ease;
        }
        .game-card:hover { background: var(--surface-mid); }
        .game-card:hover::after { transform: scaleX(1); }

        .game-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .game-thumb-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--surface-mid); display: flex; align-items: center; justify-content: center; }
        .game-thumb-placeholder svg { opacity: 0.1; }

        .game-info { padding: 1.75rem; border-top: 1px solid var(--border); }

        .game-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem; font-weight: 800;
            margin-bottom: 1.25rem; line-height: 1.2;
        }

        .game-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .game-stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.3rem;
        }
        .game-stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem; font-weight: 900; color: var(--primary);
            letter-spacing: -0.02em;
        }

        .game-featured-badge {
            position: absolute; top: 1rem; right: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.55rem; letter-spacing: 0.18em;
            text-transform: uppercase;
            background: var(--primary); color: #000;
            padding: 0.3rem 0.6rem; font-weight: 700;
        }

        .empty-state {
            grid-column: 1 / -1; background: var(--surface);
            padding: 6rem 2rem; text-align: center;
            color: var(--muted); font-size: 0.875rem;
            font-family: 'DM Mono', monospace; letter-spacing: 0.1em;
        }

        .fade-up { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .page-header { padding: 110px 1.5rem 3.5rem; }
            .section { padding: 3.5rem 1.5rem 5rem; }
            .games-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="page-header-grid"></div>
        <div class="page-header-inner">
            <div class="section-label">Explore</div>
            <h1>Our Games.</h1>
            <p>Worlds we've built on Roblox — crafted for millions of players.</p>
        </div>
    </div>

    <main class="section">
        <div class="games-grid fade-up" id="games-grid">
            <div class="empty-state">Loading games…</div>
        </div>
    </main>

    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script>
        function fmt(n) {
            if (!n) return '0';
            if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
            if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
            if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
            return n.toLocaleString();
        }

        async function loadGames() {
            const grid = document.getElementById('games-grid');
            try {
                const { games } = await fetch('/api/games').then(r => r.json());
                if (!games.length) {
                    grid.innerHTML = '<div class="empty-state">No games published yet.</div>';
                    return;
                }
                grid.innerHTML = games.map(g => `
                    <a href="https://www.roblox.com/games/${g.placeId}" target="_blank" class="game-card">
                        ${g.featured ? '<span class="game-featured-badge">Featured</span>' : ''}
                        ${g.thumbnail
                            ? `<img src="${g.thumbnail}" class="game-thumb" alt="${g.name || 'Game'}" loading="lazy">`
                            : `<div class="game-thumb-placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>`
                        }
                        <div class="game-info">
                            <div class="game-name">${g.name || 'Untitled Game'}</div>
                            <div class="game-stats">
                                <div>
                                    <div class="game-stat-label">Visits</div>
                                    <div class="game-stat-value">${fmt(g.visits)}</div>
                                </div>
                                <div>
                                    <div class="game-stat-label">Playing</div>
                                    <div class="game-stat-value">${fmt(g.playing)}</div>
                                </div>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch(e) {
                grid.innerHTML = '<div class="empty-state">Failed to load games.</div>';
            }
        }

        loadGames();

        const obs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.08 });
        document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
    </script>
</body>
</html>
